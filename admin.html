<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>피드백 관리자 센터 - 주말 언제와?</title>
  <link rel="icon" type="image/png" href="/day-off.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================
       1. Material Design 3 토큰 정의
       ========================================== */
    :root {
      --md-sys-color-primary: #005fb0;
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-primary-container: #d6e4ff;
      --md-sys-color-on-primary-container: #001b3d;
      
      --md-sys-color-secondary: #535f70;
      --md-sys-color-secondary-container: #d7e3f7;
      --md-sys-color-on-secondary-container: #101c2b;
      
      --md-sys-color-surface: #ffffff;
      --md-sys-color-surface-dim: #f8fafc;
      --md-sys-color-surface-container: #ffffff;
      --md-sys-color-surface-container-high: #f1f5f9;
      --md-sys-color-surface-container-highest: #e2e8f0;
      
      --md-sys-color-on-surface: #0f172a;
      --md-sys-color-on-surface-variant: #475569;
      --md-sys-color-outline: #94a3b8;
      --md-sys-color-outline-variant: #cbd5e1;
      
      --md-sys-color-error: #ba1a1a;
      --md-sys-color-error-container: #ffdad6;
      --md-sys-color-on-error-container: #410002;

      --md-shape-corner-xs: 4px;
      --md-shape-corner-s: 8px;
      --md-shape-corner-m: 10px;
      --md-shape-corner-l: 14px;
      --md-shape-corner-xl: 20px;
      --md-shape-corner-full: 9999px;

      --md-elevation-1: 0 1px 3px 0 rgba(15, 23, 42, 0.06), 0 1px 2px -1px rgba(15, 23, 42, 0.06);
      --md-elevation-2: 0 4px 6px -1px rgba(15, 23, 42, 0.06), 0 2px 4px -2px rgba(15, 23, 42, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--md-sys-color-surface-dim);
      color: var(--md-sys-color-on-surface);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 0 40px;
    }

    .material-symbols-outlined {
      font-size: 18px;
      vertical-align: middle;
      font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 20;
    }

    .container {
      width: 100%;
      max-width: 1140px;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ==========================================
       2. 마퀴 (Marquee) 텍스트 롤링
       ========================================== */
    .marquee-box {
      width: 100%;
      max-width: 100%;
      overflow: hidden;
      white-space: nowrap;
      display: block;
      position: relative;
    }

    .marquee-text {
      display: inline-block;
      white-space: nowrap;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      vertical-align: middle;
    }

    .marquee-text.is-marquee {
      max-width: none;
      overflow: visible;
      text-overflow: clip;
      animation: autoMarqueeScroll 4.2s ease-in-out infinite alternate;
      will-change: transform;
    }

    @keyframes autoMarqueeScroll {
      0%, 20% {
        transform: translateX(0);
      }
      80%, 100% {
        transform: translateX(var(--marquee-dist, -24px));
      }
    }

    /* ==========================================
       3. 상단 탑 앱 바
       ========================================== */
    .top-app-bar {
      width: 100%;
      background-color: var(--md-sys-color-surface);
      border-bottom: 1.5px solid var(--md-sys-color-outline-variant);
      box-shadow: var(--md-elevation-1);
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: center;
      padding: 8px 16px;
      margin-bottom: 12px;
    }

    .top-app-bar-inner {
      width: 100%;
      max-width: 1140px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1 1 auto;
      overflow: hidden;
    }

    .brand-logo-badge {
      width: 32px;
      height: 32px;
      border-radius: var(--md-shape-corner-s);
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-text.marquee-box {
      flex: 1;
      min-width: 0;
    }

    .brand-text h1.marquee-text {
      font-size: 1.05rem;
      font-weight: 900;
      color: var(--md-sys-color-on-surface);
      line-height: 1.2;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .md-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 6px 12px;
      border-radius: var(--md-shape-corner-full);
      font-size: 0.75rem;
      font-weight: 700;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
      white-space: nowrap;
      user-select: none;
    }

    .md-btn-tonal {
      background-color: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
      border-color: var(--md-sys-color-outline-variant);
    }
    .md-btn-tonal:hover {
      background-color: #c5d7f2;
    }

    .md-btn-error {
      background-color: var(--md-sys-color-error-container);
      color: var(--md-sys-color-error);
      border-color: rgba(186, 26, 26, 0.2);
    }
    .md-btn-error:hover {
      background-color: #ffc9c2;
    }

    .md-btn-filled {
      background-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
    }
    .md-btn-filled:hover {
      background-color: #00497d;
    }

    .sync-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: var(--md-shape-corner-full);
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-primary);
      font-size: 0.6875rem;
      font-weight: 800;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .sync-status-pill.active {
      opacity: 1;
    }
    .spin-icon {
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* ==========================================
       4. 로그인 인증 카드
       ========================================== */
    .auth-container {
      width: 100%;
      min-height: calc(100vh - 120px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-card {
      width: 100%;
      max-width: 360px;
      background-color: var(--md-sys-color-surface-container);
      border-radius: var(--md-shape-corner-xl);
      border: 1.5px solid var(--md-sys-color-outline-variant);
      box-shadow: var(--md-elevation-2);
      padding: 30px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .auth-icon-circle {
      width: 48px;
      height: 48px;
      border-radius: var(--md-shape-corner-full);
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
    }
    .auth-icon-circle .material-symbols-outlined { font-size: 24px; }

    .auth-header h2 {
      font-size: 1.2rem;
      font-weight: 900;
      color: var(--md-sys-color-on-surface);
    }
    .auth-header p {
      font-size: 0.75rem;
      color: var(--md-sys-color-on-surface-variant);
      margin-top: 4px;
    }

    .auth-input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: left;
    }

    .m3-text-field {
      width: 100%;
      padding: 12px 14px;
      background-color: var(--md-sys-color-surface-container-high);
      border: 1.5px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-shape-corner-s);
      font-size: 0.875rem;
      color: var(--md-sys-color-on-surface);
      outline: none;
      transition: border-color 0.2s ease;
    }
    .m3-text-field:focus {
      border-color: var(--md-sys-color-primary);
      background-color: var(--md-sys-color-surface);
    }

    /* ==========================================
       5. KPI 요약 카드 그리드
       ========================================== */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      width: 100%;
    }

    .kpi-card {
      background-color: var(--md-sys-color-surface-container);
      border: 1.5px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-shape-corner-m);
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--md-elevation-1);
      min-width: 0;
      gap: 8px;
    }

    .kpi-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
      flex: 1;
      overflow: hidden;
    }

    .kpi-label {
      font-size: 0.6875rem;
      font-weight: 700;
      color: var(--md-sys-color-on-surface-variant);
      white-space: nowrap;
      overflow: hidden;
    }

    .kpi-value {
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--md-sys-color-on-surface);
      line-height: 1.1;
      margin-top: 2px;
    }

    .kpi-icon-box {
      width: 32px;
      height: 32px;
      border-radius: var(--md-shape-corner-s);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .kpi-icon-box.total { background-color: var(--md-sys-color-primary-container); color: var(--md-sys-color-primary); }
    .kpi-icon-box.bug { background-color: #fee2e2; color: #b91c1c; }
    .kpi-icon-box.improve { background-color: #fef3c7; color: #d97706; }
    .kpi-icon-box.idea { background-color: #e0e7ff; color: #4338ca; }

    /* ==========================================
       6. 검색 & 필터 바
       ========================================== */
    .filter-search-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background-color: var(--md-sys-color-surface-container);
      border: 1.5px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-shape-corner-m);
      padding: 8px 12px;
      box-shadow: var(--md-elevation-1);
    }

    .filter-chips-group {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding: 2px 0;
    }
    .filter-chips-group::-webkit-scrollbar {
      display: none;
    }

    .filter-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 11px;
      border-radius: var(--md-shape-corner-s);
      background-color: var(--md-sys-color-surface-container-high);
      border: 1px solid var(--md-sys-color-outline-variant);
      color: var(--md-sys-color-on-surface-variant);
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
      flex-shrink: 0;
    }

    .filter-chip:hover {
      border-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-surface);
    }

    .filter-chip.active {
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      border-color: var(--md-sys-color-primary);
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 6px;
      background-color: var(--md-sys-color-surface-container-high);
      border: 1.5px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-shape-corner-full);
      padding: 4px 12px;
      width: 220px;
      flex-shrink: 0;
    }
    .search-box:focus-within {
      border-color: var(--md-sys-color-primary);
      background-color: var(--md-sys-color-surface);
    }
    .search-box input {
      border: none;
      background: transparent;
      outline: none;
      font-size: 0.75rem;
      color: var(--md-sys-color-on-surface);
      width: 100%;
    }
    .search-box .material-symbols-outlined {
      color: var(--md-sys-color-outline);
      font-size: 16px;
    }

    /* ==========================================
       7. PC 데이터 테이블 뷰 (>768px)
       ========================================== */
    .table-container-card {
      background-color: var(--md-sys-color-surface-container);
      border: 1.5px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-shape-corner-m);
      overflow: hidden;
      box-shadow: var(--md-elevation-1);
      display: block;
    }

    table.m3-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    table.m3-table th,
    table.m3-table td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--md-sys-color-surface-container-highest);
      vertical-align: top;
    }

    table.m3-table th {
      background-color: var(--md-sys-color-surface-container-high);
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--md-sys-color-on-surface-variant);
      border-bottom: 1.5px solid var(--md-sys-color-outline-variant);
      white-space: nowrap;
    }

    table.m3-table tr:last-child td {
      border-bottom: none;
    }

    table.m3-table tr:hover td {
      background-color: var(--md-sys-color-surface-dim);
    }

    .col-no { width: 50px; text-align: center; font-weight: 800; color: var(--md-sys-color-on-surface-variant); font-size: 0.8125rem; }
    .col-date { width: 160px; font-size: 0.75rem; color: var(--md-sys-color-on-surface-variant); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .col-cat { width: 130px; }
    .col-content {
      font-size: 0.875rem;
      color: var(--md-sys-color-on-surface);
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
    }

    .cat-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 3px 8px;
      border-radius: var(--md-shape-corner-s);
      font-size: 0.6875rem;
      font-weight: 800;
      white-space: nowrap;
    }
    .badge-bug { background-color: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
    .badge-improve { background-color: #fef3c7; color: #d97706; border: 1px solid #fcd34d; }
    .badge-idea { background-color: #e0e7ff; color: #4338ca; border: 1px solid #c7d2fe; }
    .badge-etc { background-color: var(--md-sys-color-surface-container-highest); color: var(--md-sys-color-on-surface-variant); }

    /* ==========================================
       8. 모바일 카드 리스트 뷰 (<=768px)
       ========================================== */
    .mobile-cards-view {
      display: none;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .mobile-feedback-card {
      background-color: var(--md-sys-color-surface-container);
      border: 1.5px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-shape-corner-m);
      padding: 12px 14px;
      box-shadow: var(--md-elevation-1);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .mobile-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px dashed var(--md-sys-color-outline-variant);
      padding-bottom: 8px;
    }

    .mobile-card-header-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mobile-card-num {
      font-size: 0.75rem;
      font-weight: 900;
      color: var(--md-sys-color-primary);
      background-color: var(--md-sys-color-primary-container);
      padding: 1px 6px;
      border-radius: var(--md-shape-corner-s);
    }

    .mobile-card-date {
      font-size: 0.6875rem;
      color: var(--md-sys-color-on-surface-variant);
      font-variant-numeric: tabular-nums;
    }

    .mobile-card-body {
      font-size: 0.875rem;
      color: var(--md-sys-color-on-surface);
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .empty-state {
      padding: 40px 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: var(--md-sys-color-on-surface-variant);
    }
    .empty-state .material-symbols-outlined { font-size: 40px; color: var(--md-sys-color-outline); }
    .empty-state p { font-size: 0.875rem; font-weight: 600; }

    /* ==========================================
       9. 반응형 미디어 쿼리
       ========================================== */
    @media (max-width: 768px) {
      body { padding-bottom: 30px; }
      .top-app-bar { padding: 8px 12px; margin-bottom: 10px; }
      .container { padding: 0 10px; gap: 10px; }
      
      .brand-section {
        flex: 1 1 0%;
        min-width: 0;
      }
      .brand-text h1.marquee-text {
        font-size: 0.95rem;
      }

      .top-actions .btn-text {
        display: none;
      }
      .top-actions .md-btn {
        padding: 6px 8px;
      }

      .kpi-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
      .kpi-card { padding: 8px 10px; }
      .kpi-value { font-size: 1.15rem; }
      .kpi-icon-box { width: 28px; height: 28px; }
      .kpi-icon-box .material-symbols-outlined { font-size: 16px; }
      
      .filter-search-bar {
        flex-direction: column;
        align-items: stretch;
        padding: 8px 10px;
        gap: 8px;
      }
      .search-box { width: 100%; }

      .table-container-card { display: none !important; }
      .mobile-cards-view { display: flex !important; }
    }
  </style>
</head>
<body>

  <!-- 1. M3 슬림 탑 앱 바 (타이틀 마퀴 적용) -->
  <header class="top-app-bar">
    <div class="top-app-bar-inner">
      <div class="brand-section">
        <div class="brand-logo-badge">
          <span class="material-symbols-outlined">dashboard</span>
        </div>
        <div class="brand-text marquee-box" id="brand-title-box">
          <h1 class="marquee-text" id="brand-title-text">피드백 관리 센터</h1>
        </div>
      </div>

      <div class="top-actions" id="top-actions-box" style="display: none;">
        <span class="sync-status-pill" id="sync-status">
          <span class="material-symbols-outlined spin-icon" style="font-size: 12px;">sync</span>
          <span>동기화 중...</span>
        </span>
        <button type="button" class="md-btn md-btn-tonal" id="btn-refresh" onclick="fetchFeedbacks(false)">
          <span class="material-symbols-outlined">refresh</span>
          <span class="btn-text">새로고침</span>
        </button>
        <button type="button" class="md-btn md-btn-error" onclick="handleLogout()" title="로그아웃">
          <span class="material-symbols-outlined">logout</span>
          <span class="btn-text">로그아웃</span>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- 2. 비밀번호 인증 뷰 -->
    <div class="auth-container" id="auth-view">
      <div class="auth-card">
        <div class="auth-icon-circle">
          <span class="material-symbols-outlined">admin_panel_settings</span>
        </div>
        <div class="auth-header">
          <h2>관리자 인증</h2>
          <p>피드백 시스템 조회를 위해 비밀번호를 입력해주세요.</p>
        </div>
        <form onsubmit="handleLogin(event)" class="auth-input-group">
          <input type="password" id="admin-pw" class="m3-text-field" placeholder="비밀번호를 입력하세요" required autofocus />
          <button type="submit" id="login-btn" class="md-btn md-btn-filled" style="padding: 10px; font-size: 0.875rem;">
            <span>인증 및 데이터 조회</span>
          </button>
        </form>
      </div>
    </div>

    <!-- 3. 메인 대시보드 뷰 -->
    <div id="dashboard-view" style="display: none; flex-direction: column; gap: 12px;">
      
      <!-- KPI 요약 카드 그리드 -->
      <section class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-info">
            <span class="kpi-label marquee-box">
              <span class="marquee-text">전체 피드백</span>
            </span>
            <span class="kpi-value" id="kpi-total">0</span>
          </div>
          <div class="kpi-icon-box total">
            <span class="material-symbols-outlined">mark_chat_unread</span>
          </div>
        </div>

        <div class="kpi-card">
          <div class="kpi-info">
            <span class="kpi-label marquee-box">
              <span class="marquee-text">개선사항 요청</span>
            </span>
            <span class="kpi-value" id="kpi-improve">0</span>
          </div>
          <div class="kpi-icon-box improve">
            <span class="material-symbols-outlined">tune</span>
          </div>
        </div>

        <div class="kpi-card">
          <div class="kpi-info">
            <span class="kpi-label marquee-box">
              <span class="marquee-text">오류 신고</span>
            </span>
            <span class="kpi-value" id="kpi-bug">0</span>
          </div>
          <div class="kpi-icon-box bug">
            <span class="material-symbols-outlined">bug_report</span>
          </div>
        </div>

        <div class="kpi-card">
          <div class="kpi-info">
            <span class="kpi-label marquee-box">
              <span class="marquee-text">신기능 아이디어</span>
            </span>
            <span class="kpi-value" id="kpi-idea">0</span>
          </div>
          <div class="kpi-icon-box idea">
            <span class="material-symbols-outlined">lightbulb</span>
          </div>
        </div>
      </section>

      <!-- 필터 & 검색 바 -->
      <section class="filter-search-bar">
        <div class="filter-chips-group">
          <button type="button" class="filter-chip active" data-filter="all">
            <span>전체보기</span>
          </button>
          <button type="button" class="filter-chip" data-filter="개선사항 요청">
            <span class="material-symbols-outlined" style="font-size: 14px;">tune</span>
            <span>개선요청</span>
          </button>
          <button type="button" class="filter-chip" data-filter="오류신고">
            <span class="material-symbols-outlined" style="font-size: 14px;">bug_report</span>
            <span>오류신고</span>
          </button>
          <button type="button" class="filter-chip" data-filter="신기능 아이디어">
            <span class="material-symbols-outlined" style="font-size: 14px;">lightbulb</span>
            <span>신기능</span>
          </button>
        </div>

        <div class="search-box">
          <span class="material-symbols-outlined">search</span>
          <input type="text" id="search-input" placeholder="내용 검색..." />
        </div>
      </section>

      <!-- 🖥️ PC 전용 M3 데이터 테이블 뷰 -->
      <div class="table-container-card">
        <table class="m3-table">
          <thead>
            <tr>
              <th class="col-no">No.</th>
              <th class="col-date">접수 일시</th>
              <th class="col-cat">카테고리</th>
              <th>피드백 상세 내용</th>
            </tr>
          </thead>
          <tbody id="desktop-table-body">
            <!-- 렌더링 영역 -->
          </tbody>
        </table>
      </div>

      <!-- 📱 모바일 전용 M3 카드 리스트 뷰 -->
      <div class="mobile-cards-view" id="mobile-cards-container">
        <!-- 렌더링 영역 -->
      </div>

    </div>
  </main>

  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxyLX-M_XVv8_9TiIEZ9mmHaKyGz4XHE_bcwyMGWnms5fs6G-gfW6nwghUoxpFB1cL58g/exec';
    const STORAGE_KEY = 'admin_session_pass';
    const CACHE_DATA_KEY = 'admin_cached_feedbacks';

    let currentPassword = '';
    let allFeedbacks = [];
    let activeFilter = 'all';
    let searchQuery = '';

    // 🌟 가로 폭을 벗어나는 텍스트 감지 후 자동 Marquee 애니메이션 적용 (헤더 타이틀 포함)
    function checkAndApplyMarquees() {
      const marqueeBoxes = document.querySelectorAll('.marquee-box');
      marqueeBoxes.forEach(box => {
        const textEl = box.querySelector('.marquee-text');
        if (!textEl || !textEl.innerText.trim()) return;

        textEl.classList.remove('is-marquee');

        const containerWidth = box.clientWidth;
        const textWidth = textEl.scrollWidth;

        if (textWidth > containerWidth + 1) {
          textEl.classList.add('is-marquee');
          const overflowDistance = textWidth - containerWidth + 8;
          textEl.style.setProperty('--marquee-dist', `-${overflowDistance}px`);
        } else {
          textEl.style.removeProperty('--marquee-dist');
        }
      });
    }

    function formatDateTime(val) {
      if (!val) return '-';
      const d = new Date(val);
      if (isNaN(d.getTime())) return String(val);
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      const hh = String(d.getHours()).padStart(2, '0');
      const min = String(d.getMinutes()).padStart(2, '0');
      const ss = String(d.getSeconds()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd} ${hh}:${min}:${ss}`;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    function getCategoryBadge(category) {
      const cat = String(category || '').trim();
      if (cat === '오류신고') return `<span class="cat-badge badge-bug"><span class="material-symbols-outlined" style="font-size: 13px;">bug_report</span>오류신고</span>`;
      if (cat === '개선사항 요청') return `<span class="cat-badge badge-improve"><span class="material-symbols-outlined" style="font-size: 13px;">tune</span>개선요청</span>`;
      if (cat === '신기능 아이디어') return `<span class="cat-badge badge-idea"><span class="material-symbols-outlined" style="font-size: 13px;">lightbulb</span>신기능</span>`;
      return `<span class="cat-badge badge-etc">${escapeHtml(cat || '기타')}</span>`;
    }

    function handleLogin(e) {
      e.preventDefault();
      currentPassword = document.getElementById('admin-pw').value.trim();
      fetchFeedbacks(true);
    }

    function handleLogout() {
      if (confirm('로그아웃 하시겠습니까? 다음 접속 시 비밀번호를 다시 입력해야 합니다.')) {
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(CACHE_DATA_KEY);
        currentPassword = '';
        allFeedbacks = [];
        document.getElementById('admin-pw').value = '';
        document.getElementById('dashboard-view').style.display = 'none';
        document.getElementById('top-actions-box').style.display = 'none';
        document.getElementById('auth-view').style.display = 'flex';
      }
    }

    async function fetchFeedbacks(isManualLogin = false) {
      const syncStatus = document.getElementById('sync-status');
      const loginBtn = document.getElementById('login-btn');
      const refreshBtn = document.getElementById('btn-refresh');

      if (syncStatus) syncStatus.classList.add('active');
      if (isManualLogin && loginBtn) loginBtn.innerText = '인증 확인 중...';
      if (refreshBtn) refreshBtn.style.opacity = '0.6';

      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'getAdminFeedbacks',
            password: currentPassword
          })
        });

        const result = await response.json();

        if (result.status === 'success') {
          localStorage.setItem(STORAGE_KEY, currentPassword);
          localStorage.setItem(CACHE_DATA_KEY, JSON.stringify(result.data));

          allFeedbacks = result.data || [];
          document.getElementById('auth-view').style.display = 'none';
          document.getElementById('dashboard-view').style.display = 'flex';
          document.getElementById('top-actions-box').style.display = 'flex';

          updateKpis();
          renderViews();
          checkAndApplyMarquees();
        } else {
          localStorage.removeItem(STORAGE_KEY);
          localStorage.removeItem(CACHE_DATA_KEY);
          document.getElementById('dashboard-view').style.display = 'none';
          document.getElementById('top-actions-box').style.display = 'none';
          document.getElementById('auth-view').style.display = 'flex';
          alert(result.message || '인증에 실패했습니다. 비밀번호를 다시 확인하세요.');
        }
      } catch (err) {
        console.error('관리자 조회 오류:', err);
        if (isManualLogin) {
          alert('데이터를 가져오는 중 네트워크 오류가 발생했습니다.');
        }
      } finally {
        if (syncStatus) syncStatus.classList.remove('active');
        if (loginBtn) loginBtn.innerText = '인증 및 데이터 조회';
        if (refreshBtn) refreshBtn.style.opacity = '1';
      }
    }

    function updateKpis() {
      let bugCount = 0;
      let improveCount = 0;
      let ideaCount = 0;

      allFeedbacks.forEach(item => {
        const cat = String(item.category || '').trim();
        if (cat === '오류신고') bugCount++;
        else if (cat === '개선사항 요청') improveCount++;
        else if (cat === '신기능 아이디어') ideaCount++;
      });

      document.getElementById('kpi-total').innerText = allFeedbacks.length;
      document.getElementById('kpi-bug').innerText = bugCount;
      document.getElementById('kpi-improve').innerText = improveCount;
      document.getElementById('kpi-idea').innerText = ideaCount;
    }

    function renderViews() {
      const desktopTbody = document.getElementById('desktop-table-body');
      const mobileContainer = document.getElementById('mobile-cards-container');

      const filtered = allFeedbacks.filter(item => {
        const matchCategory = (activeFilter === 'all') || (item.category === activeFilter);
        const matchSearch = !searchQuery || 
          String(item.content || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
          String(item.id || '').toLowerCase().includes(searchQuery.toLowerCase());
        return matchCategory && matchSearch;
      });

      if (filtered.length === 0) {
        const emptyHtml = `
          <div class="empty-state">
            <span class="material-symbols-outlined">inbox</span>
            <p>조건에 일치하는 피드백 내역이 없습니다.</p>
          </div>
        `;
        desktopTbody.innerHTML = `<tr><td colspan="4">${emptyHtml}</td></tr>`;
        mobileContainer.innerHTML = emptyHtml;
        return;
      }

      desktopTbody.innerHTML = filtered.map((item, index) => {
        const formattedDate = formatDateTime(item.createdAt);
        const badgeHtml = getCategoryBadge(item.category);
        const rowNo = index + 1;

        return `
          <tr>
            <td class="col-no">${rowNo}</td>
            <td class="col-date">${formattedDate}</td>
            <td class="col-cat">${badgeHtml}</td>
            <td class="col-content">${escapeHtml(item.content || '')}</td>
          </tr>
        `;
      }).join('');

      mobileContainer.innerHTML = filtered.map((item, index) => {
        const formattedDate = formatDateTime(item.createdAt);
        const badgeHtml = getCategoryBadge(item.category);
        const rowNo = index + 1;

        return `
          <div class="mobile-feedback-card">
            <div class="mobile-card-header">
              <div class="mobile-card-header-left">
                <span class="mobile-card-num">#${rowNo}</span>
                ${badgeHtml}
              </div>
              <span class="mobile-card-date">${formattedDate}</span>
            </div>
            <div class="mobile-card-body">${escapeHtml(item.content || '')}</div>
          </div>
        `;
      }).join('');
    }

    function setupFilterAndSearch() {
      const chips = document.querySelectorAll('.filter-chip');
      chips.forEach(chip => {
        chip.addEventListener('click', () => {
          chips.forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          activeFilter = chip.dataset.filter;
          renderViews();
        });
      });

      const searchInput = document.getElementById('search-input');
      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value.trim();
        renderViews();
      });

      let resizeTimer = null;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(checkAndApplyMarquees, 150);
      });
    }

    (function initInstantAuth() {
      const savedPass = localStorage.getItem(STORAGE_KEY);
      if (savedPass) {
        currentPassword = savedPass;
        document.getElementById('auth-view').style.display = 'none';
        document.getElementById('dashboard-view').style.display = 'flex';
        document.getElementById('top-actions-box').style.display = 'flex';

        const cachedFeedbacks = localStorage.getItem(CACHE_DATA_KEY);
        if (cachedFeedbacks) {
          try {
            allFeedbacks = JSON.parse(cachedFeedbacks);
            updateKpis();
            renderViews();
          } catch (e) {}
        }

        fetchFeedbacks(false);
      }
    })();

    document.addEventListener('DOMContentLoaded', () => {
      setupFilterAndSearch();
      checkAndApplyMarquees();
    });
  </script>
</body>
</html>
